# Dependabot for the Elixir (mix) packages and the GitHub Actions this repo
# uses. .github/workflows/dependabot-auto-merge.yml merges the mix minor and
# patch PRs once CI passes and the checks there pass; majors, mix.exs
# changes and Actions updates wait for you. Merging doesn't deploy; the
# Monday job on the PC does that.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    # Wait a week after a release before proposing it, so a bad release has
    # time to be caught and pulled. Security updates skip this wait.
    cooldown:
      default-days: 7
    # One PR for all minor and patch updates; each major gets its own PR,
    # since those are the ones that can break things.
    groups:
      mix-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A local stub that replaces the real grpcbox (see vendor/grpcbox_stub).
      - dependency-name: "grpcbox"

  # Keeps the pinned action versions in .github/workflows current. Never
  # auto-merged: a change to a workflow always waits for you.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
